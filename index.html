function dialogFocusables(root){return [...root.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null)}
function trapDialogFocus(event,dialog){
  if(event.key!=='Tab')return;
  const focusables=dialogFocusables(dialog);if(!focusables.length)return;
  const first=focusables[0],last=focusables[focusables.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
}
document.addEventListener('keydown',event=>{
  const modal=document.getElementById('supportItemModal');
  const drawer=document.getElementById('ticketDrawer');
  const dialog=modal?.querySelector('[role="dialog"]')||drawer?.querySelector('[role="dialog"]');
  if(!dialog)return;
  if(event.key==='Escape'){event.preventDefault();if(modal)closeSupportItemModal();else closeTicketDrawer();return}
  trapDialogFocus(event,dialog);
});

// === STALL RECOMMENDATIONS ===
function showStallRecs(intent){
  const avail=STALLS.filter(s=>s.status==='open');
  let sorted;
  if(intent.includes('Fastest'))sorted=[...avail].sort((a,b)=>parseInt(a.time)-parseInt(b.time));
  else if(intent.includes('Popular'))sorted=[...avail].sort((a,b)=>b.rating-a.rating);
  else sorted=[...avail].sort(()=>Math.random()-.5);
  const recs=sorted.slice(0,3);
  say(`Here are ${recs.length} stalls I'd recommend:`,300).then(()=>{
    recs.forEach(s=>{
      const top=MENUS[s.id]?[...MENUS[s.id]].sort((a,b)=>b.pop-a.pop).slice(0,2):[];
      addEl(`<div class="card" style="margin-bottom:6px"><div class="cbox">
        <div style="padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer" onclick="selectStall('${s.id}')">
          <div style="width:40px;height:40px;border-radius:10px;background:${s.bg};display:flex;align-items:center;justify-content:center;font-size:20px">${s.emoji}</div>
          <div style="flex:1"><strong style="font-size:13px">${s.name}</strong><div style="font-size:11px;color:var(--text2)">⭐${s.rating} • ${s.time} • ${s.dist} • ${s.tags[0]}</div>${top.length?`<div style="font-size:11px;color:var(--text2);margin-top:2px">${top.map(i=>i.name).join(', ')}</div>`:''}</div>
        </div>
        <div style="display:flex;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border)">
          <button style="padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:11px;color:var(--text2);cursor:pointer" onclick="notForMe('${s.id}')">Not for me</button>
          <button class="btn btn-p" style="padding:5px 14px;font-size:11px" onclick="selectStall('${s.id}')">Select stall →</button>
        </div>
      </div></div>`)
    });
    addFb()
  })
}

  const items=[...MENUS[id]].filter(i=>i.avail).sort((a,b)=>b.pop-a.pop);
  const show=items.slice(0,5);const more=items.length>5;
  say(`${s.name}'s menu (${items.length} items):`,300).then(()=>{
    let h=`<div class="card"><div class="cbox">`;
    show.forEach(i=>{h+=`<div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s" onclick="selectItem('${i.id}')" onmouseenter="this.style.background='var(--bg)'" onmouseleave="this.style.background=''"><div style="flex:1"><div style="font-size:13px;font-weight:600">${i.name}</div><div style="font-size:11px;color:var(--text2)">${i.desc}</div></div><span style="font-size:13px;font-weight:700">$${i.price}</span></div>`});
    h+=`</div></div>`;addEl(h);
    if(more)setTimeout(()=>chips(['Show more','See all','🔍 Search'],c=>{if(c==='Show more')showMore(id,5);else if(c==='See all')showAll(id);else doSearch(id)}),200)
  })
}
function showMore(id,offset){
  const items=[...MENUS[id]].filter(i=>i.avail).sort((a,b)=>b.pop-a.pop).slice(offset,offset+5);
  if(!items.length){say("That's everything!");return}
  let h=`<div class="card"><div class="cbox">`;
  items.forEach(i=>{h+=`<div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="selectItem('${i.id}')"><div style="flex:1"><div style="font-size:13px;font-weight:600">${i.name}</div><div style="font-size:11px;color:var(--text2)">${i.desc}</div></div><span style="font-size:13px;font-weight:700">$${i.price}</span></div>`});
  h+=`</div></div>`;addEl(h);
  if(MENUS[id].filter(i=>i.avail).length>offset+5)setTimeout(()=>chips(['Show more','See all'],c=>{if(c==='Show more')showMore(id,offset+5);else showAll(id)}),200)
}
function showAll(id){const items=[...MENUS[id]].filter(i=>i.avail).sort((a,b)=>b.pop-a.pop);let h=`<div class="card"><div class="cbox">`;items.forEach(i=>{h+=`<div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="selectItem('${i.id}')"><div style="flex:1"><div style="font-size:13px;font-weight:600">${i.name}</div><div style="font-size:11px;color:var(--text2)">${i.desc}</div></div><span style="font-size:13px;font-weight:700">$${i.price}</span></div>`});h+=`</div></div>`;addEl(h)}
function doSearch(id){say("Search this menu:",300).then(()=>{addEl(`<div style="padding-left:36px;max-width:92%"><input type="text" class="ipt" id="ms" style="width:100%;border-radius:10px" placeholder="e.g. chicken, spicy..." onkeydown="if(event.key==='Enter')runSearch('${id}')"/></div>`)})}
function runSearch(id){const q=document.getElementById('ms').value.trim().toLowerCase();if(!q)return;usr(q);const r=MENUS[id].filter(i=>i.avail&&(i.name+' '+i.desc).toLowerCase().includes(q));if(r.length){let h=`<div class="card"><div class="cbox">`;r.forEach(i=>{h+=`<div style="display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);cursor:pointer" onclick="selectItem('${i.id}')"><div style="flex:1"><div style="font-size:13px;font-weight:600">${i.name}</div><div style="font-size:11px;color:var(--text2)">${i.desc}</div></div><span style="font-size:13px;font-weight:700">$${i.price}</span></div>`});h+=`</div></div>`;addEl(h)}else say("No matches. Try a different word.",300)}

// === ITEM CONFIG ===
function selectItem(id){
  const item=MENUS[curStall].find(i=>i.id===id);if(!item||!item.avail){say("Item unavailable.",300);return}
  cfgItem=item;cfgQty=1;cfgSel={};
  let oh='';
  if(item.opts&&Object.keys(item.opts).length){Object.entries(item.opts).forEach(([k,vs])=>{oh+=`<div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;margin:10px 0 6px">${k} <span style="color:var(--pri)">required</span></div><div style="display:flex;flex-wrap:wrap;gap:6px">`;vs.forEach((v,i)=>{oh+=`<button type="button" class="chip${i===0?' sel':''}" style="padding:8px 12px;font-size:12px;border-radius:8px" onclick="cfgSel(this,'${k}','${v}')">${v}</button>`;if(i===0)cfgSel[k]=v});oh+=`</div>`})}
  oh+=`<div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;margin:10px 0 6px">Quantity</div><div style="display:flex;align-items:center;gap:14px"><button style="width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);font-size:15px;cursor:pointer" onclick="cfgQ(-1)">−</button><span style="font-size:15px;font-weight:700" id="cq">1</span><button style="width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface);font-size:15px;cursor:pointer" onclick="cfgQ(1)">+</button></div>`;
  oh+=`<button class="btn btn-p" style="width:100%;margin-top:14px" id="abtn" onclick="addToCart()">Add to Cart — $${item.price}</button>`;
  say(`<strong>${item.name}</strong> — $${item.price}<br><span style="font-size:12px;color:var(--text2)">${item.desc}</span>`,300).then(()=>{addEl(`<div class="card"><div class="cbox" style="padding:14px">${oh}</div></div>`)})
}
window.cfgSel=function(el,k,v){el.parentElement.querySelectorAll('.chip').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');cfgSel[k]=v;updCfgPrice()}
function cfgQ(d){cfgQty=Math.max(1,cfgQty+d);document.getElementById('cq').textContent=cfgQty;updCfgPrice()}
function updCfgPrice(){let x=0;Object.values(cfgSel).forEach(v=>{const m=v.match(/\+\$(\d+)/);if(m)x+=parseInt(m[1])});document.getElementById('abtn').textContent=`Add to Cart — $${(cfgItem.price+x)*cfgQty}`}
function addToCart(){let x=0;Object.values(cfgSel).forEach(v=>{const m=v.match(/\+\$(\d+)/);if(m)x+=parseInt(m[1])});cart.push({name:cfgItem.name,opts:Object.values(cfgSel).join(', '),qty:cfgQty,price:cfgItem.price+x});say(`✓ Added ${cfgQty}× ${cfgItem.name}`,300).then(()=>chips(['Browse more from this stall','View cart','Checkout'],c=>{if(c.includes('Browse'))selectStall(curStall);else if(c==='View cart')showCart();else doCheckout()}))}
// === CART ===
function showCart(){
  if(!cart.length){say("Cart is empty.",300).then(()=>chips(['Help me choose food','🏠 Home'],c=>{if(c.includes('choose'))intentFood();else goHome()}));return}
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  let h=`<div class="card"><div class="cbox"><div style="padding:12px 14px;font-size:14px;font-weight:700;border-bottom:1px solid var(--border)">🛒 Cart</div>`;
  cart.forEach((item,i)=>{h+=`<div style="padding:10px 14px;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between"><div><div style="font-size:13px;font-weight:600">${item.name}</div><div style="font-size:11px;color:var(--text2)">${item.opts||'Standard'}</div></div><span style="font-size:13px;font-weight:700">$${item.price*item.qty}</span></div><div style="display:flex;align-items:center;gap:8px;margin-top:6px"><button style="width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer" onclick="cartQty(${i},-1)">−</button><span style="font-size:12px;font-weight:700">${item.qty}</span><button style="width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:12px;cursor:pointer" onclick="cartQty(${i},1)">+</button><button style="margin-left:auto;font-size:11px;color:var(--err);background:none;border:none;cursor:pointer" onclick="cartRm(${i})">Remove</button></div></div>`});
  h+=`<div style="padding:12px 14px;background:var(--bg);border-top:1px solid var(--border)"><div style="display:flex;justify-content:space-between;font-size:14px;font-weight:700"><span>Subtotal</span><span>$${sub}</span></div></div>`;
  h+=`<div style="display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--border)"><button class="btn btn-s" style="flex:1" onclick="selectStall(curStall)">+ Add more</button><button class="btn btn-p" style="flex:2" onclick="doCheckout()">Checkout →</button></div></div></div>`;
  addEl(h)
}
function cartQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);showCart()}
function cartRm(i){cart.splice(i,1);showCart()}

// === CHECKOUT (promo + coins + payment) ===
function doCheckout(){
  if(!cart.length){say("Cart is empty!");return}
  const sub=cart.reduce((s,i)=>s+i.price*i.qty,0);
  say(`Subtotal: $${sub}. Any promo code or Send Coins to apply?`,400).then(()=>{
    chips(['Apply promo','Use Send Coins ($1.80)','Skip — proceed to pay'],c=>{
      if(c.includes('promo')){say("Available: FOOD20 (20% off). Apply?",300).then(()=>chips(['Apply FOOD20','Skip'],x=>{if(x.includes('Apply'))say("✓ FOOD20 applied! 20% off.",300).then(()=>showPayment(sub,Math.round(sub*.2)));else showPayment(sub,0)}))}
      else if(c.includes('Coins')){say("✓ $1.80 Send Coins applied.",300).then(()=>showPayment(sub,1.80))}
      else showPayment(sub,0)
    })
  })
}
function showPayment(sub,disc){
  const fee=3,total=sub+fee-disc;
  say(`Final: $${total.toFixed(2)} (delivery $${fee}${disc?', discount -$'+disc.toFixed(2):''}). Ready to pay via PayNow?`,400).then(()=>{
    chips(['Proceed to PayNow','Edit cart'],c=>{

function classifySupportIssue(text){
  const q=text.toLowerCase();
  if(/\bcancel\b|changed my mind/.test(q))return 'Cancel order';
  if(/\brefund\b|money back|reimburse|compensat/.test(q))return 'Refund request';
  if(/\bmissing\b|didn.?t (get|receive|arrive)|never (came|arrived)|left out|forgot/.test(q))return 'Missing item';
  if(/\bwrong\b|incorrect|not what i|mixed up|someone else/.test(q))return 'Wrong item';
  if(/spill|damag|soggy|\bcold\b|stale|inedible|\bquality\b/.test(q))return 'Damaged or spilled';
  if(/\bpayment\b|paynow|charge|\bpaid\b|\bcard\b|transaction|deducted/.test(q))return 'Payment issue';
  if(/\blate\b|\bslow\b|too long|taking.*long|still waiting|hasn.?t arrived|delayed/.test(q))return 'Order taking too long';
  return 'Other';
}
function isItemScopedIssue(issue,desc){
  if(['Missing item','Wrong item','Damaged or spilled','Refund request'].includes(issue))return true;
  return issue==='Other'&&/\b(item|dish|food|meal|burger|pizza|fries|noodle|rice|salad|drink|coffee|tea|bread)\b/.test(desc.toLowerCase())
}
function issueNeedsEvidence(issue){return ['Missing item','Wrong item','Damaged or spilled','Payment issue'].includes(issue)}
function receiveSupportDescription(text){

// Trouble language always beats FAQ language: the composer is now the main route into support
const SUPPORT_TRIGGER=/\b(issue|problem|complaint|complain|missing|wrong|refund|cancel|spill|spilled|damaged|soggy|stale|inedible|overcharged|charged twice|double charged|not received|never arrived|didn.?t arrive|didn.?t get|late|delayed|too long|still waiting|failed|declined|stuck)\b/;
const FOOD_TRIGGER=/\b(food|eat|hungry|recommend|choose|craving|browse|stall|menu|show me)\b/;
function faqAnswerFor(q){
  if(SUPPORT_TRIGGER.test(q))return '';
  if(/\b(delivery fee|delivery fees|delivery charge|delivery charges)\b/.test(q))return 'Delivery fees range from $2-$5 depending on distance from the stall to your location.';
  if(/\b(coverage|deliver.*area|delivery area)\b/.test(q))return 'SendFood delivers within a 5 km radius of each stall in Singapore.';
  if(/\b(payment|paynow|card|cards)\b/.test(q))return 'Currently PayNow (QR). Cards and other payment methods are coming soon.';
  if(/\b(promo|promos|send coins|sendcoin|coins)\b/.test(q))return 'Apply promo codes at checkout. Send Coins can be used at 100 coins = $1, and can be toggled before payment.';
  if(/\b(account|change.*address|update.*address|postal)\b/.test(q))return 'You can update your delivery address using a 6-digit postal code. Contact Customer Support for account changes.';
  return '';
}
function send(){const inp=document.getElementById('ipt');const t=inp.value.trim();if(!t)return;inp.value='';usr(t);
if(supportAwaiting==='description'){supportAwaiting=null;receiveSupportDescription(t);return}
const q=t.toLowerCase();
if(SUPPORT_TRIGGER.test(q)){intentHelp();return}
const faq=faqAnswerFor(q);if(faq){say(faq,400).then(addFb);return}
if(FOOD_TRIGGER.test(q)&&!/\b(my order|track)\b/.test(q))intentFood();
else if(/\b(help|support)\b/.test(q))intentHelp();
else if(/\b(track|where.*delivery|my order|status)\b/.test(q)){if(ACTIVE_ORDER)doTrack(true);else intentOrders()}
else if(/\b(fee|payment|coverage|promo|coin|account)\b/.test(q))intentAsk();
else if(/\b(home|back|start)\b/.test(q))goHome();
else if(/\b(cart|checkout)\b/.test(q))showCart();
else say("I can help with food recommendations, orders, support, or SendFood questions. What do you need?",400)}

// === INIT ===
showHome();
</script>
